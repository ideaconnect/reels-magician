name: CI

# Builds the app and runs the logic checks on Windows and Ubuntu, so a change made on one
# system cannot quietly break the other. The checks need no tools, GPU or network. They run a
# second time under pl-PL, so a number written for ffmpeg, an ASS file or settings.json without
# the invariant culture fails the build. Each job then publishes the app as its release package
# does and holds the About tab's licence table to it, so a new package cannot ship without a row
# there. On Windows the publish is also packed into the installer, which is installed, started
# and uninstalled again on the runner.

on:
  push:
    branches: [main, "port/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build the app and the checks
        run: dotnet build ReelsMagician.slnx -c Release
      - name: Logic checks
        run: dotnet run --project tests/ReelsMagician.SmokeTests -c Release --no-build -- logic
      - name: Logic checks under pl-PL
        run: dotnet run --project tests/ReelsMagician.SmokeTests -c Release --no-build -- logic pl-PL
      - name: Publish
        run: dotnet publish src/ReelsMagician.App -c Release -r win-x64 --self-contained -o out/publish
      - name: Licences in the publish
        run: dotnet run --project tests/ReelsMagician.SmokeTests -c Release --no-build -- licences out/publish
      - name: Build the installer
        shell: pwsh
        run: packaging/windows/build-installer.ps1 out/publish 0.0.0-dev out/installer
      - name: Install, start and uninstall it
        shell: pwsh
        run: packaging/windows/check-installer.ps1 out/installer

  ubuntu:
    name: Ubuntu
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build the app and the checks
        run: dotnet build ReelsMagician.slnx -c Release
      - name: Logic checks
        run: dotnet run --project tests/ReelsMagician.SmokeTests -c Release --no-build -- logic
      - name: Logic checks under pl-PL
        run: dotnet run --project tests/ReelsMagician.SmokeTests -c Release --no-build -- logic pl-PL
      - name: Publish
        run: dotnet publish src/ReelsMagician.App -c Release -r linux-x64 --self-contained -o out/publish
      - name: Licences in the publish
        run: dotnet run --project tests/ReelsMagician.SmokeTests -c Release --no-build -- licences out/publish
